services:
  - type: web
    name: anti-fraud-bot-v5
    runtime: python
    plan: starter   # 付費方案（約 $7/月）：不休眠、可掛持久磁碟保存資料
    # 手冊檔已直接 commit 在 public/handbook/，不需 build.py 複製（移除以免誤刪）
    buildCommand: pip install -r requirements.txt
    # 單一 worker：演練 session 存在行程記憶體，多 worker 會互相看不到 session
    # threads 100：大型講習（數百人同時）時，每回合都在等 Anthropic 回應（I/O），多執行緒不吃記憶體、可同時服務更多人
    startCommand: gunicorn server:app --workers 1 --threads 100 --timeout 120 --bind 0.0.0.0:$PORT
    # 持久磁碟：訓練資料放這，重新部署／重啟都不會被清空
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/training_data.db   # 資料庫放到持久磁碟，永久保存
      - key: ANTHROPIC_API_KEY
        sync: false   # 在 Render 後台手動設定，不寫入 git
      # ── AI 供應商切換（用於比較 Anthropic／OpenAI 輸出品質，預設不影響現況）──
      - key: AI_PROVIDER
        value: anthropic   # 先維持預設 anthropic；要測試 OpenAI 時手動在 Render 後台改成 openai
      - key: OPENAI_API_KEY
        sync: false   # 在 Render 後台手動設定，不寫入 git（AI_PROVIDER=openai 時才需要）
      - key: OPENAI_MODEL
        value: gpt-4o-mini   # 可換成 gpt-5-mini 或其他 OpenAI 相容模型 id 做比較測試；改這裡就好，不用動程式碼
      - key: ADMIN_PASSWORD
        sync: false   # 舊式後台密碼（登入制上線後僅作 bootstrap 備援；ADMIN_KEY_FALLBACK=1 時才允許 ?key=）
      # ── 資安（V3 移植）：後台改為帳號登入＋2FA＋IP 允用＋稽核 ──
      - key: SECRET_KEY
        sync: false   # Flask 登入 cookie 簽章金鑰（64 位亂數；不設會每次重啟登出）
      - key: ADMIN_BOOTSTRAP_USER
        sync: false   # 首次啟動自動建立的管理員帳號（只在 admin_users 為空時生效）
      - key: ADMIN_BOOTSTRAP_PASS
        sync: false   # 初始密碼（登入後強制修改）
      - key: ADMIN_IDLE_TIMEOUT
        value: "1800"   # 後台閒置逾時（秒）
      - key: ADMIN_IP_ENFORCE
        value: "1"      # 後台 IP 允用強制（清單空＝全放行；被鎖時暫設 0）
      # 自動 Email 備份（訓練完成自動寄完整備份）；不設就是關閉，功能其餘照常
      # Render 封鎖 SMTP 埠，需用 Resend（HTTPS）。到 resend.com 申請免費 API key。
      - key: RESEND_API_KEY
        sync: false   # Resend API 金鑰（re_ 開頭）
      - key: BACKUP_EMAIL
        value: mingshin228@gmail.com   # 收件信箱（用此信箱註冊 Resend 即免驗證網域）
      # 以下 SMTP 為備援（本機/不擋 SMTP 環境才有效，Render 上會 timeout）
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      - key: DAILY_LIMIT
        value: "3000"   # 全站每日總量（＝預算天花板；700 人各做前後測約 1400 場；沒人用不花錢）
      - key: PER_PERSON_PER_MINUTE
        value: "20"     # 每人每分鐘（防連點/機器人）
      - key: PER_PERSON_PER_DAY
        value: "30"     # 每人每天演練場次（改按人算，同單位不互鎖）
      - key: MAX_TURNS_PER_SESSION
        value: "50"
      # ── Claude API 佇列（claude_queue.py）：同時最多幾個請求真的在打 Claude＋送出前的 RPM／ITPM 限流 ──
      # RPM／ITPM 請照 Anthropic Console → Settings → Limits 裡 claude-haiku-4-5 的上限，打 9 折填入
      - key: CLAUDE_QUEUE_WORKERS
        value: "150"      # 同時跟 Claude 對話的上限；壓測 700 人：6 個只有 6% 完成、80 個每句等約 9 秒、150 個約 4 秒
      - key: CLAUDE_QUEUE_RPM
        value: "9000"     # 過去 60 秒最多請求數（Scale 上限 10,000 RPM 的 9 成；700 人實測換算約需 2,100）
      - key: CLAUDE_QUEUE_ITPM
        value: "9000000"  # 過去 60 秒最多 input tokens，讀取快取不計（Scale 上限 1,000 萬的 9 成；700 人約需 220 萬）
      - key: CLAUDE_QUEUE_TIMEOUT
        value: "60"       # 單筆從送出到完成的上限秒數，超過一律回「系統忙碌，請稍後再試」
      - key: PYTHON_VERSION
        value: "3.12.6"
