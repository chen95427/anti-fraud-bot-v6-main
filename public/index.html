<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阻詐演練機器人</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1e3a5f;
      --primary-light: #2d5a8e;
      --accent: #e8b931;
      --bg: #f0f2f5;
      --white: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --red: #dc2626;
      --yellow: #f59e0b;
      --green: #16a34a;
      --black-signal: #374151;
      --chat-police: #dbeafe;
      --chat-citizen: #f3f4f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ===== 頁面切換 ===== */
    .page { display: none; height: 100vh; flex-direction: column; }
    .page.active { display: flex; }

    /* ===== 選擇頁面 ===== */
    .setup-page {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 50%, #1e3a5f 100%);
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-y: auto;
    }

    .setup-container {
      background: var(--white);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .setup-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .setup-title h1 {
      font-size: 26px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .setup-title p {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 6px;
    }

    .badge {
      background: var(--accent);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .section-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-label span.step {
      background: var(--primary);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* 燈號選擇 */
    .signal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .signal-btn {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      background: var(--white);
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .signal-btn:hover { border-color: var(--primary-light); background: #f8fafc; }
    .signal-btn.selected { border-color: var(--primary); background: #eef2ff; box-shadow: 0 0 0 3px rgba(30,58,95,0.15); }

    .signal-btn .signal-icon { font-size: 22px; margin-bottom: 4px; }
    .signal-btn .signal-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .signal-btn .signal-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }

    /* 詐騙類型 */
    .fraud-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .fraud-btn {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--white);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fraud-btn:hover { border-color: var(--primary-light); }
    .fraud-btn.selected { border-color: var(--primary); background: #eef2ff; box-shadow: 0 0 0 3px rgba(30,58,95,0.15); }
    .fraud-btn .fraud-label { font-size: 14px; font-weight: 600; }
    .fraud-btn .fraud-tag { font-size: 12px; color: var(--text-light); }

    /* Persona */
    .persona-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fafafa;
      min-height: 72px;
    }

    .persona-card.has-persona { background: #fffbeb; border-color: var(--accent); }
    .persona-avatar { font-size: 36px; }
    .persona-info .persona-name { font-size: 15px; font-weight: 600; }
    .persona-info .persona-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .persona-placeholder { color: var(--text-light); font-size: 13px; }

    .start-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .start-btn:hover:not(:disabled) { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,95,0.3); }
    .start-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ===== 對話頁面 ===== */
    .chat-page { background: var(--bg); }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    .chat-header-info h2 { font-size: 15px; font-weight: 600; }
    .chat-header-info .chat-subtitle { font-size: 11px; opacity: 0.8; }

    .chat-header-right { display: flex; gap: 8px; }

    .header-action-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .header-action-btn:hover { background: rgba(255,255,255,0.25); }
    .header-action-btn.feedback-btn { background: var(--accent); color: var(--primary); border-color: var(--accent); }
    .header-action-btn.feedback-btn:hover { background: #d4a52a; }

    /* 情境提示 */
    .scenario-bar {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .scenario-bar .scenario-signal { font-size: 18px; }
    .scenario-bar .scenario-text { color: #92400e; font-weight: 500; }

    /* 對話區 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.citizen { align-self: flex-start; }
    .message.police { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.citizen .msg-avatar { background: #fee2e2; }
    .message.police .msg-avatar { background: #dbeafe; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.citizen .msg-bubble {
      background: var(--white);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.police .msg-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-label {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    /* 打字中動畫 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* 輸入區 */
    .chat-input-area {
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 24px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .chat-input-area input:focus { border-color: var(--primary); }
    .chat-input-area input:disabled { background: #f3f4f6; }

    .send-btn, .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn {
      background: var(--primary);
      color: white;
      font-size: 18px;
    }

    .send-btn:hover:not(:disabled) { background: var(--primary-light); }
    .send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .mic-btn {
      background: var(--white);
      border: 2px solid var(--border);
      font-size: 18px;
    }

    .mic-btn:hover { border-color: var(--primary); }
    .mic-btn.recording { background: #fee2e2; border-color: var(--red); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
    }

    .turn-counter {
      font-size: 11px;
      color: var(--text-light);
      text-align: center;
      padding: 4px;
    }

    /* ===== 點評頁面 ===== */
    .feedback-page {
      background: var(--bg);
    }

    .feedback-header {
      background: var(--primary);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feedback-header h2 { font-size: 16px; }

    .feedback-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .feedback-card {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.8;
    }

    .feedback-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .feedback-loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .feedback-actions {
      padding: 16px 20px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .feedback-actions button {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-restart {
      background: var(--primary);
      color: white;
    }

    .btn-restart:hover { background: var(--primary-light); }

    .btn-new {
      background: var(--white);
      border: 2px solid var(--border) !important;
      color: var(--text);
    }

    .btn-new:hover { border-color: var(--primary) !important; }

    /* ===== 回合提示 ===== */
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      padding: 4px 12px;
      background: #f9fafb;
      border-radius: 20px;
      align-self: center;
    }

    /* ===== RWD ===== */
    @media (max-width: 480px) {
      .setup-container { padding: 24px 18px; }
      .signal-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .signal-btn { padding: 10px 8px; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>

<!-- ===== 頁面一：情境選擇 ===== -->
<div id="setupPage" class="page setup-page active">
  <div class="setup-container">
    <div class="setup-title">
      <h1>
        <span>🛡️</span> 阻詐演練機器人
        <span class="badge">v1.0</span>
      </h1>
      <p>員警溝通技巧訓練系統 — AI 扮演受騙民眾</p>
    </div>

    <div class="section-label"><span class="step">1</span> 選擇燈號</div>
    <div class="signal-grid">
      <div class="signal-btn" data-signal="red" onclick="selectSignal(this)">
        <div class="signal-icon">🔴</div>
        <div class="signal-name">紅燈</div>
        <div class="signal-desc">激動拒絕，目標：請坐下</div>
      </div>
      <div class="signal-btn" data-signal="yellow" onclick="selectSignal(this)">
        <div class="signal-icon">🟡</div>
        <div class="signal-name">黃燈</div>
        <div class="signal-desc">猶豫但仍想匯款</div>
      </div>
      <div class="signal-btn" data-signal="green" onclick="selectSignal(this)">
        <div class="signal-icon">🟢</div>
        <div class="signal-name">綠燈</div>
        <div class="signal-desc">平靜，主動詢問</div>
      </div>
      <div class="signal-btn" data-signal="black" onclick="selectSignal(this)">
        <div class="signal-icon">⚫</div>
        <div class="signal-name">特殊</div>
        <div class="signal-desc">異常冷靜，有備詞</div>
      </div>
    </div>

    <div class="section-label"><span class="step">2</span> 選擇詐騙類型</div>
    <div class="fraud-grid">
      <div class="fraud-btn" data-fraud="fake_police" onclick="selectFraud(this)">
        <span style="font-size:20px">😨</span>
        <span class="fraud-label">假檢警</span>
        <span class="fraud-tag">（嗔）恐懼驅動</span>
      </div>
      <div class="fraud-btn" data-fraud="investment" onclick="selectFraud(this)">
        <span style="font-size:20px">💰</span>
        <span class="fraud-label">投資詐騙</span>
        <span class="fraud-tag">（貪）貪婪驅動</span>
      </div>
      <div class="fraud-btn" data-fraud="romance" onclick="selectFraud(this)">
        <span style="font-size:20px">💔</span>
        <span class="fraud-label">感情詐騙</span>
        <span class="fraud-tag">（癡）情感依附</span>
      </div>
      <div class="fraud-btn" data-fraud="arrogant" onclick="selectFraud(this)">
        <span style="font-size:20px">😤</span>
        <span class="fraud-label">傲慢型</span>
        <span class="fraud-tag">（慢）自信拒絕</span>
      </div>
      <div class="fraud-btn" data-fraud="suspicious" onclick="selectFraud(this)">
        <span style="font-size:20px">🤔</span>
        <span class="fraud-label">主動懷疑</span>
        <span class="fraud-tag">（疑）自我掙扎</span>
      </div>
    </div>

    <div class="section-label"><span class="step">3</span> 演練對象</div>
    <div id="personaCard" class="persona-card">
      <span class="persona-placeholder">請先選擇燈號與詐騙類型</span>
    </div>

    <button id="startBtn" class="start-btn" disabled onclick="startSession()">開始演練</button>
  </div>
</div>

<!-- ===== 頁面二：對話 ===== -->
<div id="chatPage" class="page chat-page">
  <div class="chat-header">
    <div class="chat-header-left">
      <button class="back-btn" onclick="confirmExit()">←</button>
      <div class="chat-header-info">
        <h2 id="chatTitle">演練進行中</h2>
        <div class="chat-subtitle" id="chatSubtitle"></div>
      </div>
    </div>
    <div class="chat-header-right">
      <button class="header-action-btn feedback-btn" id="feedbackBtn" onclick="requestFeedback()">
        📋 結束點評
      </button>
    </div>
  </div>

  <div class="scenario-bar" id="scenarioBar">
    <span class="scenario-signal" id="scenarioSignal"></span>
    <span class="scenario-text" id="scenarioText"></span>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="turn-counter" id="turnCounter"></div>

  <div class="chat-input-area">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="語音輸入">🎤</button>
    <input type="text" id="chatInput" placeholder="以員警身份說話..." onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)sendMessage()" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- ===== 頁面三：點評 ===== -->
<div id="feedbackPage" class="page feedback-page">
  <div class="feedback-header">
    <span style="font-size:22px">📋</span>
    <h2>AI 教練點評</h2>
  </div>

  <div class="feedback-content">
    <div id="feedbackLoading" class="feedback-loading">
      <div class="spinner"></div>
      <p>AI 教練正在分析您的演練表現...</p>
    </div>
    <div id="feedbackCard" class="feedback-card" style="display:none"></div>
  </div>

  <div class="feedback-actions">
    <button class="btn-new" onclick="goToSetup()">🔄 重新選擇情境</button>
    <button class="btn-restart" onclick="restartSame()">▶ 同情境再練</button>
  </div>
</div>

<script>
// ===== 狀態 =====
let state = {
  signal: null,
  fraudType: null,
  personaIndex: null,
  persona: null,
  sessionId: null,
  turnCount: 0,
  isLoading: false,
};

const SIGNAL_LABELS = {
  red: '🔴 紅燈', yellow: '🟡 黃燈', green: '🟢 綠燈', black: '⚫ 特殊'
};

const FRAUD_LABELS = {
  fake_police: '假檢警（嗔）', investment: '投資詐騙（貪）',
  romance: '感情詐騙（癡）', arrogant: '傲慢型（慢）', suspicious: '主動懷疑（疑）'
};

let personas = [];

// ===== 初始化 =====
fetch('/api/personas').then(r => r.json()).then(data => { personas = data; });

// ===== 選擇燈號 =====
function selectSignal(el) {
  document.querySelectorAll('.signal-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  state.signal = el.dataset.signal;
  updatePersona();
  updateStartBtn();
}

// ===== 選擇詐騙類型 =====
function selectFraud(el) {
  document.querySelectorAll('.fraud-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  state.fraudType = el.dataset.fraud;
  updatePersona();
  updateStartBtn();
}

// ===== 更新 Persona =====
function updatePersona() {
  const card = document.getElementById('personaCard');
  if (!state.signal || !state.fraudType) {
    card.className = 'persona-card';
    card.innerHTML = '<span class="persona-placeholder">請先選擇燈號與詐騙類型</span>';
    state.personaIndex = null;
    return;
  }

  const idx = personas.findIndex(p => p.signal === state.signal && p.fraud === state.fraudType);
  if (idx >= 0) {
    const p = personas[idx];
    state.personaIndex = idx;
    state.persona = p;
    card.className = 'persona-card has-persona';
    card.innerHTML = `
      <span class="persona-avatar">${p.avatar}</span>
      <div class="persona-info">
        <div class="persona-name">${p.name}</div>
        <div class="persona-desc">${p.desc}</div>
      </div>
    `;
  } else {
    state.personaIndex = 0;
    state.persona = personas[0];
    card.className = 'persona-card';
    card.innerHTML = '<span class="persona-placeholder">此組合將隨機指派人物</span>';
  }
}

function updateStartBtn() {
  document.getElementById('startBtn').disabled = !(state.signal && state.fraudType);
}

// ===== 開始演練 =====
async function startSession() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '正在初始化...';

  state.sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
  state.turnCount = 0;

  try {
    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        signal: state.signal,
        fraudType: state.fraudType,
        personaIndex: state.personaIndex ?? 0,
        sessionId: state.sessionId,
      }),
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    if (data.persona) state.persona = data.persona;

    // 切換到對話頁
    showPage('chatPage');
    setupChatHeader();

    const msgArea = document.getElementById('chatMessages');
    msgArea.innerHTML = '';

    // 系統提示
    addSystemMessage('演練開始 — 您現在是到場的員警');

    // AI 民眾開場白
    addMessage('citizen', data.opening);

  } catch (err) {
    alert('啟動失敗：' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '開始演練';
  }
}

// ===== 對話頁面設定 =====
function setupChatHeader() {
  const p = state.persona;
  document.getElementById('chatTitle').textContent = p ? `${p.avatar} ${p.name}` : '演練進行中';
  document.getElementById('chatSubtitle').textContent =
    `${SIGNAL_LABELS[state.signal]} × ${FRAUD_LABELS[state.fraudType]}`;

  const signalIcons = { red: '🔴', yellow: '🟡', green: '🟢', black: '⚫' };
  document.getElementById('scenarioSignal').textContent = signalIcons[state.signal];
  document.getElementById('scenarioText').textContent =
    `${FRAUD_LABELS[state.fraudType]} — ${p ? p.desc : ''}`;

  updateTurnCounter();
}

function updateTurnCounter() {
  const el = document.getElementById('turnCounter');
  el.textContent = `第 ${state.turnCount} 回合${state.turnCount >= 5 ? '（可結束點評）' : ''}`;
}

// ===== 訊息顯示 =====
function addMessage(type, text) {
  const msgArea = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${type}`;

  const avatarText = type === 'citizen' ? (state.persona?.avatar || '👤') : '👮';
  const label = type === 'citizen' ? '民眾' : '員警';

  div.innerHTML = `
    <div class="msg-avatar">${avatarText}</div>
    <div class="msg-bubble">
      <div class="msg-label">${label}</div>
      ${escapeHtml(text)}
    </div>
  `;
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function addSystemMessage(text) {
  const msgArea = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  msgArea.appendChild(div);
}

function showTyping() {
  const msgArea = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message citizen';
  div.id = 'typingMsg';
  div.innerHTML = `
    <div class="msg-avatar">${state.persona?.avatar || '👤'}</div>
    <div class="msg-bubble">
      <div class="msg-label">民眾</div>
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== 發送訊息 =====
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || state.isLoading) return;

  input.value = '';
  state.isLoading = true;
  setInputEnabled(false);

  addMessage('police', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId: state.sessionId }),
    });

    const data = await res.json();
    hideTyping();

    if (!res.ok) throw new Error(data.error);

    state.turnCount = data.turnCount;
    updateTurnCounter();
    addMessage('citizen', data.reply);

  } catch (err) {
    hideTyping();
    addSystemMessage('系統錯誤：' + err.message);
  } finally {
    state.isLoading = false;
    setInputEnabled(true);
    input.focus();
  }
}

function setInputEnabled(enabled) {
  document.getElementById('chatInput').disabled = !enabled;
  document.getElementById('sendBtn').disabled = !enabled;
}

// ===== 語音輸入 =====
let recognition = null;
let isRecording = false;

function toggleMic() {
  if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
    alert('您的瀏覽器不支援語音輸入，請使用 Chrome 或 Edge');
    return;
  }

  if (isRecording) {
    stopMic();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-TW';
  recognition.continuous = false;
  recognition.interimResults = true;

  const input = document.getElementById('chatInput');
  const micBtn = document.getElementById('micBtn');

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    input.placeholder = '正在聆聽...';
  };

  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    input.value = final || interim;
  };

  recognition.onerror = (e) => {
    console.error('語音辨識錯誤:', e.error);
    stopMic();
    if (e.error === 'not-allowed') {
      alert('請允許麥克風權限');
    }
  };

  recognition.onend = () => {
    stopMic();
  };

  recognition.start();
}

function stopMic() {
  if (recognition) {
    recognition.stop();
    recognition = null;
  }
  isRecording = false;
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
  document.getElementById('chatInput').placeholder = '以員警身份說話...';
}

// ===== 結束點評 =====
async function requestFeedback() {
  if (state.turnCount < 3) {
    if (!confirm(`目前僅第 ${state.turnCount} 回合，建議至少 5 回合再點評。確定要結束嗎？`)) return;
  }

  showPage('feedbackPage');
  document.getElementById('feedbackLoading').style.display = '';
  document.getElementById('feedbackCard').style.display = 'none';

  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: state.sessionId }),
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    document.getElementById('feedbackLoading').style.display = 'none';
    const card = document.getElementById('feedbackCard');
    card.style.display = '';
    card.textContent = data.feedback;

  } catch (err) {
    document.getElementById('feedbackLoading').innerHTML =
      `<p style="color:var(--red)">點評失敗：${err.message}</p>`;
  }
}

// ===== 頁面切換 =====
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function goToSetup() {
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: state.sessionId }),
  });
  state.sessionId = null;
  state.turnCount = 0;
  showPage('setupPage');
}

function restartSame() {
  fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: state.sessionId }),
  });
  startSession();
}

function confirmExit() {
  if (state.turnCount > 0) {
    if (!confirm('確定要離開嗎？演練記錄將不會保存。')) return;
  }
  goToSetup();
}
</script>
